services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: stockclaro
      POSTGRES_USER: stockclaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockclaro_local}
      TZ: America/Lima
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockclaro -d stockclaro"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PGHOST: db
      PGUSER: stockclaro
      PGPASSWORD: ${POSTGRES_PASSWORD:-stockclaro_local}
      PGDATABASE: stockclaro
      DEMO_PASSWORD: ${DEMO_PASSWORD:-NexoInventario2026!}
      APP_LOAD_DEMO: ${APP_LOAD_DEMO:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
volumes:
  postgres_data:
